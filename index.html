<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara Frontal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: whitesmoke;
            /*display: flex;*/
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        video {
            width: 100%;
            height: 80%;
            object-fit: cover;
            transform: scaleX(-1); /* Efecto espejo para que se sienta natural */
        }
        .error-msg {
            color: black;
            text-align: center;
            padding: 20px;
            display: none;
        }
        #msg-final {
            padding: 15px;
            background-color: black;
            color: greenyellow;
            font-size: 23px;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Alineación horizontal (centro) */
            align-items: center;     /* Alineación vertical (centro) */
            height: 20%;

            font-family: "Share Tech", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
    </style>
</head>
<body>
    <div id="msg-final">
        <div>La prevención es el arbitro</div>
        <div>entre la vida y la muerte</div>
        <div">y solo depende de..</div>
    </div>
    <video id="webcam" autoplay playsinline muted></video>
    <div id="error" class="error-msg">
        <p>No se pudo acceder a la cámara frontal.</p>
        <p>Asegúrate de dar los permisos necesarios en tu navegador.</p>
    </div>
    <script>
        async function iniciarCamara() {
            const video = document.getElementById('webcam');
            const errorDiv = document.getElementById('error');

            const opciones = {
                audio: false, // No necesitamos micrófono
                video: {
                    facingMode: "user", // Fuerza el uso de la cámara frontal
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(opciones);
                video.srcObject = stream;
            } catch (err) {
                console.error("Error al acceder a la cámara: ", err);
                video.style.display = 'none';
                errorDiv.style.display = 'block';
            }
        }

        // Inicia la cámara automáticamente al cargar la pantalla
        window.addEventListener('DOMContentLoaded', iniciarCamara);
    </script>
</body>
</html>
